<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raven Secret Note</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41; /* Warna hijau khas terminal */
            font-family: 'Courier New', Courier, monospace;
        }
        .note-card {
            background: #1a1a1a;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        .note-card:hover {
            border-color: #00ff41;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold tracking-widest uppercase mb-2">
                &gt; Secret_Note_v1.0
            </h1>
            <p class="text-gray-500 italic">Secure. Private. Anonymous.</p>
            <div class="h-1 w-20 bg-green-500 mx-auto mt-4"></div>
        </header>

        <main>
            <h2 class="text-xl mb-4 text-gray-300 underline">Public Directories:</h2>
            
            <div class="grid gap-4">
                {% for id, note in notes.items() %}
                <a href="/view/{{ id }}" class="note-card p-4 rounded-lg block group">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs text-gray-500 block mb-1">ID: {{ id }}</span>
                            <h3 class="text-lg font-semibold group-hover:underline">{{ note.title }}</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-sm text-gray-400">Author:</span>
                            <span class="text-sm font-mono">{{ note.author }}</span>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </main>

        <footer class="mt-12 text-center text-xs text-gray-600">
            <p>&copy; 2026 Raven Unity Security. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
